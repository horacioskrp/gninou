[package]
name = "gninou"
version = "0.1.0"
edition = "2021"
description = "Afficher et contrôler un appareil Android depuis le bureau (client desktop)"
license = "Apache-2.0"
repository = "https://github.com/karfi/gninou"
default-run = "gninou"

[[bin]]
name = "gninou"
path = "src/main.rs"

[features]
# Par défaut : build léger, sans dépendance native (le décodage vidéo est
# alors « stats-only »). Activer `ffmpeg` pour le décodage réel (FFmpeg requis).
default = []
ffmpeg = ["dep:ffmpeg-next"]
display = ["dep:sdl3"]
# Interface graphique de bureau (egui/eframe). Le CLI reste disponible sans.
# `png` sert aux captures d'écran et à l'enregistrement d'images depuis la GUI.
gui = ["dep:eframe", "dep:png"]

[dependencies]
# CLI
clap = { version = "4.5.23", features = ["derive"] }
# logs
log = "0.4.22"
env_logger = "0.11.5"
# erreurs
anyhow = "1.0.95"

# Décodage vidéo réel (optionnel) : nécessite FFmpeg installé pour compiler.
ffmpeg-next = { version = "7.1.0", optional = true }
# Affichage réel (optionnel) : nécessite SDL3 installé pour compiler.
sdl3 = { version = "0.22.0", optional = true }
# Interface graphique de bureau (optionnelle) : GUI 100 % Rust, sans webview.
eframe = { version = "0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",
], optional = true }
# Encodage PNG pour captures d'écran / enregistrement (GUI), 100 % Rust.
png = { version = "0.17.14", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
