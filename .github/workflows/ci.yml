name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Annule une exécution précédente encore en cours sur la même réf.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test --verbose

      - name: Build (par défaut, sans features natives)
        run: cargo build --verbose

  server:
    name: Serveur (Kotlin/JVM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android (android.jar pour compileOnly)
        uses: android-actions/setup-android@v3

      - name: Plateforme android-34
        run: sdkmanager "platforms;android-34"

      - name: Gradle (provisionné, sans wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Tests serveur
        run: gradle test -PandroidJar="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

      - name: Build JAR
        run: gradle jar -PandroidJar="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
